<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Eventos | Colegio Bolívar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #07111f;
            color: #eaf2ff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 40px 30px;
            text-align: center;
            background: #101e33;
            border: 1px solid #243b5a;
            border-radius: 20px;
            box-shadow: 0 0 35px rgba(0, 225, 255, 0.08);
        }

        h1 {
            color: #00e5ff;
            font-size: 30px;
            letter-spacing: 1px;
            margin-bottom: 12px;
            text-shadow: 0 0 12px rgba(0, 229, 255, 0.4);
        }

        p {
            color: #a8bad3;
            font-size: 15px;
            line-height: 1.6;
        }

        .label {
            margin-top: 35px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 12px;
            color: #8299b8;
        }

        #contador {
            font-size: 82px;
            font-weight: 700;
            color: #39ffb6;
            margin: 10px 0 30px;
            text-shadow: 0 0 20px rgba(57, 255, 182, 0.35);
            font-variant-numeric: tabular-nums;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        button {
            width: 100%;
            padding: 15px 20px;
            border: 1px solid transparent;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active {
            transform: scale(0.98);
        }

        button:focus-visible {
            outline: 2px solid white;
            outline-offset: 4px;
        }

        #sumar {
            color: #06141d;
            background: #00e5ff;
            box-shadow: 0 0 16px rgba(0, 229, 255, 0.2);
        }

        #sumar:hover {
            background: #66f0ff;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.4);
        }

        #restar {
            color: #39ffb6;
            background: #142c35;
            border-color: #39ffb6;
        }

        #restar:hover {
            background: #1c4146;
            box-shadow: 0 0 18px rgba(57, 255, 182, 0.15);
        }

        #reiniciar {
            color: #ff6b81;
            background: #321b2b;
            border-color: #ff4d6d;
        }

        #reiniciar:hover {
            background: #492033;
            box-shadow: 0 0 18px rgba(255, 77, 109, 0.2);
        }

        footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #243b5a;
            color: #7187a5;
            font-size: 12px;
        }

        @media (max-width: 400px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 25px;
            }

            #contador {
                font-size: 68px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Colegio Bolívar</h1>
        <p>Contador interactivo de eventos escolares</p>

        <p class="label">Eventos registrados</p>
        <div id="contador" aria-live="polite" aria-atomic="true">0</div>

        <div class="buttons">
            <button id="sumar" onclick="incrementar()">
                + Registrar evento
            </button>

            <button id="restar" onclick="decrementar()">
                − Restar evento
            </button>

            <button id="reiniciar" onclick="reiniciar()">
                Reiniciar contador
            </button>
        </div>

        <footer>
            Colegio Bolívar · Registro de eventos
        </footer>
    </main>

    <script>
        let clicks = 0;

        const contador = document.getElementById("contador");

        function actualizarContador() {
            contador.textContent = clicks;
        }

        function incrementar() {
            clicks++;
            actualizarContador();
        }

        function decrementar() {
            if (clicks > 0) {
                clicks--;
                actualizarContador();
            }
        }

        function reiniciar() {
            clicks = 0;
            actualizarContador();
        }
    </script>
</body>
</html>
